services:
  mes-wrapper:
    build:
      context: .
      dockerfile: Dockerfile
    image: sanm-mes-wrapper:local
    container_name: sanm-mes-wrapper
    restart: unless-stopped
    environment:
      APP_ENV: prod          # prod | uat
      UVICORN_WORKERS: "10"
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      # Point this at the local clone of the git repo on the host.
      - /path/to/local/Sanm-MES-Wrapper:/app
